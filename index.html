<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zapíš počet</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
    color: #1e3a5f;
    background: #e8f4fb;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: manipulation;
  }
  .app {
    height: 100dvh;
    padding: 1vh 2vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7vh;
  }
  h1 {
    margin: 0;
    font-size: 4.4vh;
    letter-spacing: 0.03em;
  }
  .board {
    flex: 0 0 auto;
    width: min(88vw, 132vh);
    height: 24vh;
    background: #ffffff;
    border: 0.45vh solid #2c6e9e;
    border-radius: 1.2vh;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(2, 1fr);
    padding: 0.8vh;
  }
  .board .slot {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board .slot svg { width: 82%; height: 82%; }
  .feedback {
    flex: 0 0 auto;
    height: 8.5vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .feedback .smiley { width: 7.5vh; height: 7.5vh; display: none; }
  .feedback .smiley svg { width: 100%; height: 100%; }
  table {
    border-collapse: collapse;
    flex: 0 0 auto;
  }
  td, th {
    width: 15.5vh;
    height: 7vh;
    border: 0.4vh solid #2c6e9e;
    text-align: center;
    vertical-align: middle;
    padding: 0.3vh;
  }
  td.corner { border: none; background: transparent; }
  td.letterS, th.letterS, th.shapeSym {
    background: #ffffff;
    font-size: 3.4vh;
    font-weight: 700;
  }
  th.shapeSym svg { height: 4.6vh; width: auto; display: inline-block; }
  td.colorcell { border: 0.4vh solid #1e3a5f; }
  td.cell {
    background: #fdf6cf;
    cursor: pointer;
  }
  td.cell.locked { cursor: default; }
  td.cell.wrong {
    background: #fdf6cf;
    border: 0.55vh solid #e53935;
  }
  .sticks {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5vh 0.7vh;
    justify-content: center;
    align-content: center;
    max-width: calc(5 * (0.9vh + 0.7vh));
    margin: 0 auto;
    height: 100%;
  }
  .stick {
    width: 0.9vh;
    height: 4.6vh;
    border-radius: 0.45vh;
    background: #37474f;
    flex: 0 0 auto;
  }
  .bottom {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    height: 9vh;
  }
  #btn-main {
    font-family: inherit;
    font-weight: 700;
    font-size: 3.4vh;
    color: #ffffff;
    background: #2e9e4f;
    border: 0.45vh solid #1c6b34;
    border-radius: 1.6vh;
    box-shadow: 0 0.7vh 0 #1c6b34;
    cursor: pointer;
    padding: 0 4vw;
    height: 100%;
    max-height: 7.6vh;
  }
  #btn-main:active:not(:disabled) { transform: translateY(0.45vh); box-shadow: 0 0.25vh 0 #1c6b34; }
  #btn-main:focus-visible { outline: 0.4vh solid #f5b940; outline-offset: 0.3vh; }
  #btn-main:disabled { opacity: 0.55; cursor: default; }
  .hint-line { font-size: 2.2vh; color: #54718c; flex: 0 0 auto; }
</style>
</head>
<body>
<div class="app">
  <h1>ZAPÍŠ POČET.</h1>
  <div class="board" id="board"></div>
  <div class="feedback"><div class="smiley" id="smiley"></div></div>
  <table id="tab"></table>
  <div class="bottom">
    <button id="btn-main" type="button">SKONTROLUJ</button>
  </div>
  <div class="hint-line">Ťukni a pridaj paličku. Dvakrát ťukni a vymaž políčko.</div>
</div>

<script>
"use strict";

/* dvojice dobre rozlíšiteľných farieb */
const PAIRS = [
  ["#e53935", "#1e88e5"],
  ["#8e24aa", "#fb8c00"],
  ["#1e88e5", "#43a047"],
  ["#e53935", "#43a047"],
  ["#d81b60", "#00897b"],
  ["#3949ab", "#fb8c00"]
];
const TYPES = ["square", "circle", "triangle"];
const NEUTRAL = "#546e7a";

const COMBOS = ["sq0", "ci0", "tr0", "sq1", "ci1", "tr1"];
const KEY_ORDER = [
  "r1sq", "r1ci", "r1tr", "r1S",
  "r2sq", "r2ci", "r2tr", "r2S",
  "r3sq", "r3ci", "r3tr"
];
const SMILE_HAPPY =
  '<svg viewBox="0 0 100 100">' +
  '<circle cx="50" cy="50" r="46" fill="#ffd93d" stroke="#e0a800" stroke-width="4"/>' +
  '<circle cx="34" cy="40" r="6" fill="#5d4037"/><circle cx="66" cy="40" r="6" fill="#5d4037"/>' +
  '<path d="M28 60 Q50 80 72 60" fill="none" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>' +
  '</svg>';
const SMILE_SAD =
  '<svg viewBox="0 0 100 100">' +
  '<circle cx="50" cy="50" r="46" fill="#ffd93d" stroke="#e0a800" stroke-width="4"/>' +
  '<circle cx="34" cy="42" r="6" fill="#5d4037"/><circle cx="66" cy="42" r="6" fill="#5d4037"/>' +
  '<path d="M28 72 Q50 54 72 72" fill="none" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>' +
  '</svg>';

/* ---------- dátový model jednej úlohy ---------- */
let colors = ["#e53935", "#1e88e5"]; // farby úloh (0, 1)
let counts = { sq0: 1, ci0: 1, tr0: 1, sq1: 1, ci1: 1, tr1: 1 };
let shapes = [];       // [{type, color}]
let sticks = {};
let state = "filling"; // filling | error | repair | success
let wrongSet = new Set();
let timerId = null;

const elBoard = document.getElementById("board");
const elTab = document.getElementById("tab");
const elSmiley = document.getElementById("smiley");
const btnMain = document.getElementById("btn-main");

function ri(max) { return Math.floor(Math.random() * max); }
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = ri(i + 1); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function genTask() {
  let prevSig = COMBOS.map(function (k) { return counts[k]; }).join(",");
  for (let attempt = 0; attempt < 50; attempt++) {
    const c = { sq0: 1, ci0: 1, tr0: 1, sq1: 1, ci1: 1, tr1: 1 };
    const extra = ri(5); // 0..4 → celkovo 6..10
    const order = shuffle(COMBOS);
    let left = extra;
    for (let i = 0; i < order.length && left > 0; i++) {
      const add = Math.min(3, left, 1 + ri(2));
      c[order[i]] += add;
      left -= add;
    }
    const sig = COMBOS.map(function (k) { return c[k]; }).join(",");
    if (sig !== prevSig) {
      counts = c;
      break;
    }
  }
  const pair = PAIRS[ri(PAIRS.length)];
  colors = pair.slice();

  // rozmiestnenie: neviditeľná mriežka 9×2, náhodne obsadené políčka
  const list = [];
  COMBOS.forEach(function (k) {
    const type = k.slice(0, 2) === "sq" ? "square" : k.slice(0, 2) === "ci" ? "circle" : "triangle";
    for (let i = 0; i < counts[k]; i++) list.push({ type: type, color: parseInt(k.slice(-1), 10) });
  });
  const slots = shuffle(Array.from({ length: 18 }, function (_, i) { return i; })).slice(0, list.length);
  shapes = list.map(function (s, i) {
    return { type: s.type, color: s.color, slot: slots[i] };
  });
}

function shapeSVG(type, color) {
  const stroke = 'fill="#ffffff" stroke="' + color + '" stroke-width="7" stroke-linejoin="round"';
  if (type === "square") return '<svg viewBox="-40 -40 80 80"><rect x="-27" y="-27" width="54" height="54" rx="3" ' + stroke + "/></svg>";
  if (type === "circle") return '<svg viewBox="-40 -40 80 80"><circle cx="0" cy="0" r="30" ' + stroke + "/></svg>";
  return '<svg viewBox="-40 -40 80 80"><polygon points="0,-32 30,25 -30,25" ' + stroke + "/></svg>";
}

function shapeSymSVG(type) {
  const stroke = 'fill="none" stroke="' + NEUTRAL + '" stroke-width="6" stroke-linejoin="round"';
  if (type === "square") return '<svg viewBox="-40 -40 80 80"><rect x="-24" y="-24" width="48" height="48" rx="3" ' + stroke + "/></svg>";
  if (type === "circle") return '<svg viewBox="-40 -40 80 80"><circle cx="0" cy="0" r="27" ' + stroke + "/></svg>";
  return '<svg viewBox="-40 -40 80 80"><polygon points="0,-28 27,22 -27,22" ' + stroke + "/></svg>";
}

function renderBoard() {
  elBoard.innerHTML = "";
  for (let i = 0; i < 18; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    const sh = shapes.find(function (s) { return s.slot === i; });
    if (sh) slot.innerHTML = shapeSVG(sh.type, colors[sh.color]);
    elBoard.appendChild(slot);
  }
}

function expected() {
  const sqT = counts.sq0 + counts.sq1, ciT = counts.ci0 + counts.ci1, trT = counts.tr0 + counts.tr1;
  return {
    r1sq: counts.sq0, r1ci: counts.ci0, r1tr: counts.tr0, r1S: counts.sq0 + counts.ci0 + counts.tr0,
    r2sq: counts.sq1, r2ci: counts.ci1, r2tr: counts.tr1, r2S: counts.sq1 + counts.ci1 + counts.tr1,
    r3sq: sqT, r3ci: ciT, r3tr: trT
  };
}

function cellHTML(key) {
  return '<td class="cell" data-key="' + key + '"><div class="sticks"></div></td>';
}

function buildTable() {
  elTab.innerHTML = "";
  const tr1 = document.createElement("tr");
  tr1.innerHTML =
    '<td class="corner"></td>' +
    '<th class="shapeSym">' + shapeSymSVG("square") + "</th>" +
    '<th class="shapeSym">' + shapeSymSVG("circle") + "</th>" +
    '<th class="shapeSym">' + shapeSymSVG("triangle") + "</th>" +
    '<th class="letterS">S</th>';
  elTab.appendChild(tr1);

  const trC1 = document.createElement("tr");
  trC1.innerHTML =
    '<td class="colorcell" style="background:' + colors[0] + '"></td>' +
    cellHTML("r1sq") + cellHTML("r1ci") + cellHTML("r1tr") + cellHTML("r1S");
  elTab.appendChild(trC1);

  const trC2 = document.createElement("tr");
  trC2.innerHTML =
    '<td class="colorcell" style="background:' + colors[1] + '"></td>' +
    cellHTML("r2sq") + cellHTML("r2ci") + cellHTML("r2tr") + cellHTML("r2S");
  elTab.appendChild(trC2);

  const trS = document.createElement("tr");
  trS.innerHTML =
    '<td class="letterS">S</td>' + cellHTML("r3sq") + cellHTML("r3ci") + cellHTML("r3tr") + '<td class="corner"></td>';
  elTab.appendChild(trS);

  KEY_ORDER.forEach(function (k) {
    const cell = elTab.querySelector('[data-key="' + k + '"]');
    cell.addEventListener("click", function () { onCellClick(k, cell); });
  });
}

function renderSticks() {
  KEY_ORDER.forEach(function (k) {
    const cell = elTab.querySelector('[data-key="' + k + '"]');
    const holder = cell.querySelector(".sticks");
    holder.innerHTML = "";
    for (let i = 0; i < sticks[k]; i++) {
      const s = document.createElement("div");
      s.className = "stick";
      holder.appendChild(s);
    }
  });
}

function setCellStates() {
  KEY_ORDER.forEach(function (k) {
    const cell = elTab.querySelector('[data-key="' + k + '"]');
    cell.classList.toggle("wrong", wrongSet.has(k));
    const locked = state === "error" || state === "success" ||
      (state === "repair" && !wrongSet.has(k));
    cell.classList.toggle("locked", locked);
  });
}

function canEdit(key) {
  if (state === "filling") return true;
  if (state === "repair" && wrongSet.has(key)) return true;
  return false;
}

function onCellClick(key, cell) {
  if (!canEdit(key)) return;
  const now = Date.now();
  if (now - (cell._lastTap || 0) < 350) {
    clearTimeout(cell._timer);
    cell._lastTap = 0;
    sticks[key] = 0;
    renderSticks();
    return;
  }
  cell._lastTap = now;
  clearTimeout(cell._timer);
  cell._timer = setTimeout(function () {
    if (!canEdit(key)) return;
    if (sticks[key] < 10) {
      sticks[key]++;
      renderSticks();
      afterStickAdded();
    }
  }, 270);
}

function afterStickAdded() {
  if (state !== "repair") return;
  const allFilled = Array.from(wrongSet).every(function (k) { return sticks[k] >= 1; });
  if (allFilled) {
    state = "filling";
    wrongSet = new Set();
    setCellStates();
    btnMain.textContent = "SKONTROLUJ";
    btnMain.disabled = false;
  }
}

function showSmiley(kind) {
  elSmiley.innerHTML = kind === "happy" ? SMILE_HAPPY : SMILE_SAD;
  elSmiley.style.display = "block";
}
function hideSmiley() { elSmiley.style.display = "none"; }

btnMain.addEventListener("click", function () {
  if (state === "filling") {
    const exp = expected();
    wrongSet = new Set();
    KEY_ORDER.forEach(function (k) {
      if (sticks[k] !== exp[k]) wrongSet.add(k);
    });

    if (wrongSet.size === 0) {
      state = "success";
      setCellStates();
      showSmiley("happy");
      btnMain.disabled = true;
      clearTimeout(timerId);
      timerId = setTimeout(newTask, 5000);
      return;
    }

    state = "error";
    setCellStates();
    showSmiley("sad");
    btnMain.disabled = true;
    clearTimeout(timerId);
    timerId = setTimeout(function () {
      hideSmiley();
      state = "repair";
      setCellStates();
      btnMain.textContent = "OPRAV CHYBY";
      btnMain.disabled = false;
    }, 3000);
    return;
  }

  if (state === "repair") {
    wrongSet.forEach(function (k) { sticks[k] = 0; });
    renderSticks();
    setCellStates();
  }
});

function newTask() {
  clearTimeout(timerId);
  genTask();
  sticks = {};
  KEY_ORDER.forEach(function (k) { sticks[k] = 0; });
  wrongSet = new Set();
  state = "filling";
  hideSmiley();
  btnMain.textContent = "SKONTROLUJ";
  btnMain.disabled = false;
  renderBoard();
  buildTable();
  renderSticks();
  setCellStates();
}

newTask();
</script>
</body>
</html>
